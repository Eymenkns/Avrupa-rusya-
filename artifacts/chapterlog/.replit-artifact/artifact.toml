kind = "web"
previewPath = "/"
title = "ChapterLOG"
version = "1.0.0"
id = "artifacts/chapterlog"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 18916
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/chapterlog run dev"

[services.env]
PORT = "18916"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/chapterlog", "run", "build"]
publicDir = "artifacts/chapterlog/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
