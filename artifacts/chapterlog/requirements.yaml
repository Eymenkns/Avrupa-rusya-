packages:
  "framer-motion": "For premium scroll animations and page transitions"
  "react-hook-form": "For robust contact form handling"
  "@hookform/resolvers": "Zod validation integration for forms"
  "zod": "Schema validation for contact form"
  "clsx": "For conditional tailwind classes in reusable components"
  "tailwind-merge": "For merging tailwind classes safely"

images:
  - path: "artifacts/chapterlog/public/images/hero-bg.png"
    description: "Cinematic, dark navy blue and glowing amber abstract visualization of global logistics, featuring stylized shipping routes, a modern semi-truck or container ship subtly in the background, highly professional corporate aesthetic"
    aspect_ratio: "16:9"
  - path: "artifacts/chapterlog/public/images/about-logistics.png"
    description: "Modern, clean warehouse and logistics hub interior at dusk, subtle amber lighting accents, dark navy structures, highly professional and trustworthy"
    aspect_ratio: "16:9"

notes:
  - Static marketing website, no backend endpoints required
  - Contact form submissions are simulated with a UI toast notification
  - Using framer-motion for all scroll and entrance animations
